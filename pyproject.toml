[project]
name = "mcp-codemode-py"
version = "0.2.0"
description = "Lightweight library for calling MCP tools with minimal context overhead"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.20.0",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
mcp-codemode = "mcp_codemode.cli:main"
mcp-codemode-server = "mcp_codemode.server_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_codemode"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
